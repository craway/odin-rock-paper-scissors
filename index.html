<!DOCTYPE html>
<head>

</head>
<body>

<button id = "rock">ROCK</button>
<button id = "paper">PAPER</button>
<button id = "scissors">SCISSORS</button>

<script>
    let rockButton = document.getElementById("rock");
    let paperButton = document.getElementById("paper");
    let scissorsButton = document.getElementById("scissors");
    console.log("Welcome to Rock Paper Scissors offical game website thingy !!! :)");
    function getComputerChoice()
    {
       let choice =  Math.random();
       if (choice < 1/3)
       {
        return "rock";
       }
       else if (choice < 2/3)
       {
        return "paper";
       }
       else
       {
        return "scissors";
       }
    }
        function playRound(humanChoice,computerChoice)
        {
            console.log("You chose : " + humanChoice + "  and Computer chose : " + computerChoice);
            if (humanChoice == computerChoice)
            {
                console.log("This round is a draw");
            }
            else if ( (humanChoice == "rock" && computerChoice == "scissors") ||
            (humanChoice == "paper" && computerChoice == "rock") ||
            (humanChoice == "scissors" && computerChoice == "paper"))
            {
                console.log("You won this round");
            }
            else
            {
                console.log("You lost this round");
            }
        }
     rockButton.addEventListener("click", function()
     {playRound("rock",getComputerChoice());});
     paperButton.addEventListener("click",function() {playRound("paper",getComputerChoice())});
     scissorsButton.addEventListener("click",function() {playRound("scissors",getComputerChoice())});
</script>
</body>
